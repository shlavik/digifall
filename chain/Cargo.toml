[workspace.package]
version = "0.1.0"
authors = ["Digifall Contributors"]
edition = "2024"
license = "MIT-0"
homepage = "https://digifall.app"
repository = "https://github.com/llblab/digifall"

[workspace]
members = ["pallets/digifall", "runtime"]
resolver = "2"

[workspace.dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive", "max-encoded-len"] }
cumulus-pallet-parachain-system = { version = "0.29.0", default-features = false }
frame = { package = "polkadot-sdk-frame", version = "0.18.0", default-features = false }
polkadot-sdk = { version = "2606.3.0", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
substrate-wasm-builder = { version = "34.0.1", default-features = false }

[profile.release]
opt-level = 3
panic = "unwind"

[profile.production]
codegen-units = 1
inherits = "release"
lto = true
