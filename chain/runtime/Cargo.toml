[package]
name = "digifall-template-runtime"
description = "Minimal Polkadot SDK parachain runtime proving pallet-digifall integration"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec.workspace = true
cumulus-pallet-parachain-system.workspace = true
frame = { workspace = true, features = ["experimental", "runtime"] }
pallet-digifall = { path = "../pallets/digifall", default-features = false }
polkadot-sdk = { workspace = true, features = [
  "cumulus-pallet-parachain-system",
  "cumulus-primitives-core",
  "frame-executive",
  "frame-support",
  "frame-system",
  "pallet-assets",
  "pallet-balances",
  "pallet-insecure-randomness-collective-flip",
  "pallet-skip-feeless-payment",
  "pallet-transaction-payment",
  "polkadot-parachain-primitives",
  "runtime",
  "sp-core",
  "sp-runtime",
  "sp-version",
  "sp-weights",
] }
scale-info.workspace = true

[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

[features]
default = ["std"]
std = [
  "codec/std",
  "cumulus-pallet-parachain-system/std",
  "frame/std",
  "pallet-digifall/std",
  "polkadot-sdk/std",
  "scale-info/std",
  "substrate-wasm-builder",
]
runtime-benchmarks = [
  "cumulus-pallet-parachain-system/runtime-benchmarks",
  "frame/runtime-benchmarks",
  "pallet-digifall/runtime-benchmarks",
  "polkadot-sdk/runtime-benchmarks",
]
try-runtime = [
  "cumulus-pallet-parachain-system/try-runtime",
  "frame/try-runtime",
  "pallet-digifall/try-runtime",
  "polkadot-sdk/try-runtime",
]
